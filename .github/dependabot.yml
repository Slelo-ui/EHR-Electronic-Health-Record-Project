# Keeps the GitHub Actions in .github/workflows current. They're pinned to exact commits, and
# Dependabot updates the commit and its version comment together, in one weekly pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Only proposes releases at least a week old, so a compromised release has time to be caught.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
